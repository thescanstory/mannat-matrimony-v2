<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Preview Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Pinyon+Script&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #1C0102;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #FFFFFF;
      display: flex;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      background: linear-gradient(135deg, #1C0102 0%, #3A0204 50%, #560406 100%);
      overflow: hidden;
      border: 8px solid #A17B5E;
    }
    .left {
      flex: 1.15;
      padding: 60px 50px 60px 70px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    .right {
      flex: 0.85;
      position: relative;
      overflow: hidden;
    }
    .right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, #1C0102 0%, rgba(28, 1, 2, 0.4) 40%, transparent 100%);
    }
    .brand-top {
      display: flex;
      flex-direction: column;
    }
    .script-at {
      font-family: 'Pinyon Script', cursive;
      font-size: 38px;
      color: #A17B5E;
      line-height: 1;
      margin-bottom: -10px;
    }
    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #FFFFFF;
      font-weight: 600;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 13px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #A17B5E;
      font-weight: 700;
      margin-top: 4px;
    }
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 46px;
      font-weight: 600;
      line-height: 1.15;
      color: #FDFCFC;
      margin: 20px 0 16px 0;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .pill {
      background: rgba(161, 123, 94, 0.15);
      border: 1px solid rgba(161, 123, 94, 0.4);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #D4B89F;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 20px;
      border-top: 1px solid rgba(161, 123, 94, 0.3);
    }
    .domain {
      font-size: 16px;
      letter-spacing: 0.15em;
      font-weight: 700;
      color: #A17B5E;
      text-transform: uppercase;
    }
    .security {
      font-size: 13px;
      color: #E8DDD0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="brand-top">
        <span class="script-at">At</span>
        <span class="brand-title">MANNAT</span>
        <span class="brand-sub">Bespoke Elite Matchmaking</span>
      </div>

      <div>
        <div class="headline">No. 1 Matchmaking Service for Elites</div>
        <div class="pills">
          <div class="pill"><span>✨</span> 5x Higher Success Rates</div>
          <div class="pill"><span>🔒</span> 100% Strict Discretion</div>
          <div class="pill"><span>👑</span> Ultra HNI &amp; Distinguished Lineages</div>
        </div>
      </div>

      <div class="footer-bar">
        <div class="domain">mannatmatrimony.com</div>
        <div class="security">Strict NDA Protected</div>
      </div>
    </div>

    <div class="right">
      <img src="/images/vip/hero_vip_mansion_couple.jpg" alt="At Mannat Couple">
      <div class="gradient-overlay"></div>
    </div>
  </div>
</body>
</html>
